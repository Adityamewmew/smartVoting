<body class="bg-surface text-on-surface font-body-base antialiased min-h-screen pb-20">
<!-- Top App Bar (Mobile optimized) -->
<header class="h-16 w-full sticky top-0 z-40 bg-surface border-b border-outline-variant flex items-center justify-between px-4">
<div class="flex items-center gap-3">
<button class="p-2 -ml-2 rounded-full text-on-surface-variant hover:bg-surface-container active:opacity-80 transition-all">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<span class="font-headline-md text-headline-md font-bold text-on-surface">Add Candidate</span>
</div>
<button class="text-primary font-label-md text-label-md font-bold px-4 py-2 rounded-lg bg-primary-container text-on-primary-container active:scale-95 transition-transform">
            Save
        </button>
</header>
<!-- Main Content -->
<main class="p-container-padding max-w-lg mx-auto flex flex-col gap-section-gap">
<!-- Photo Upload Placeholder -->
<div class="flex flex-col items-center justify-center gap-4">
<div class="w-32 h-32 rounded-3xl bg-surface-container-high border-2 border-dashed border-outline-variant flex items-center justify-center relative overflow-hidden group">
<div class="flex flex-col items-center text-on-surface-variant gap-1 z-10 pointer-events-none group-active:scale-95 transition-transform">
<span class="material-symbols-outlined text-3xl" data-icon="add_a_photo">add_a_photo</span>
<span class="font-label-xs text-label-xs">Upload Photo</span>
</div>
<input accept="image/*" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer" type="file"/>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center px-4">Upload a clear, professional photo of the candidate pair. Max 5MB.</p>
</div>
<!-- Form Fields -->
<form class="flex flex-col gap-element-gap bg-card-light p-4 rounded-xl shadow-sm border border-surface-container-high">
<!-- Election Selection -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="election_id">Election</label>
<div class="relative">
<select class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 font-body-base text-body-base text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary appearance-none pr-10" id="election_id">
<option disabled="" selected="" value="">Select an election...</option>
<option value="1">2024 Student Council Election</option>
<option value="2">Engineering Faculty Dean Election</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3.5 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Order Number -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="order_number">Ballot Order Number</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 font-body-base text-body-base text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" id="order_number" placeholder="e.g., 01" type="number"/>
</div>
<!-- Chairman Name -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="chairman_name">Chairman Name</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 font-body-base text-body-base text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" id="chairman_name" placeholder="Full name of chairman candidate" type="text"/>
</div>
<!-- Vice Chairman Name -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="vice_chairman_name">Vice Chairman Name</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 font-body-base text-body-base text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" id="vice_chairman_name" placeholder="Full name of vice chairman candidate" type="text"/>
</div>
<div class="w-full h-px bg-surface-container-highest my-2"></div>
<!-- Vision -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="vision">Vision</label>
<textarea class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 font-body-base text-body-base text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary resize-y" id="vision" placeholder="Enter the primary vision statement..." rows="3"></textarea>
</div>
<!-- Mission -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant" for="mission">Mission</label>
<textarea class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 font-body-base text-body-base text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary resize-y" id="mission" placeholder="Enter the detailed mission points..." rows="5"></textarea>
</div>
</form>
</main>
