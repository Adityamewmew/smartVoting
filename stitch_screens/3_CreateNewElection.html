<style>
        body { font-family: 'Geist', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-on-background flex min-h-screen antialiased">
<!-- SideNavBar -->
<aside class="hidden md:flex flex-col bg-surface w-sidebar-width h-screen sticky top-0 left-0 bg-surface-container-low border-r border-outline-variant shadow-sm z-50">
<div class="flex flex-col h-full p-4 gap-2">
<!-- Brand -->
<div class="px-4 py-6 mb-4">
<h1 class="text-headline-lg font-headline-lg text-primary">SmartVoting</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Admin Console</p>
</div>
<!-- Navigation Links -->
<nav class="flex-1 flex flex-col gap-2">
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-container-high rounded-xl transition-colors group" href="#">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant group-hover:text-on-surface transition-colors" data-icon="dashboard">dashboard</span>
<span class="font-label-md text-label-md">Dashboard</span>
</a>
<!-- Active State -->
<a class="flex items-center gap-3 px-4 py-3 bg-secondary-container text-on-secondary-container rounded-xl font-bold" href="#">
<span class="material-symbols-outlined text-[20px]" data-icon="how_to_vote" data-weight="fill" style="font-variation-settings: 'FILL' 1;">how_to_vote</span>
<span class="font-label-md text-label-md">Elections</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-container-high rounded-xl transition-colors group" href="#">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant group-hover:text-on-surface transition-colors" data-icon="person_search">person_search</span>
<span class="font-label-md text-label-md">Candidates</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-container-high rounded-xl transition-colors group" href="#">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant group-hover:text-on-surface transition-colors" data-icon="group">group</span>
<span class="font-label-md text-label-md">Users</span>
</a>
</nav>
<!-- CTA -->

<!-- Footer Links -->
<div class="flex flex-col gap-1 border-t border-outline-variant pt-4">
<a class="flex items-center gap-3 px-4 py-2 text-on-surface-variant hover:bg-surface-container-high rounded-xl transition-colors" href="#">
<span class="material-symbols-outlined text-[18px]" data-icon="settings">settings</span>
<span class="font-label-md text-label-md">Settings</span>
</a>
<a class="flex items-center gap-3 px-4 py-2 text-on-surface-variant hover:bg-surface-container-high rounded-xl transition-colors" href="#">
<span class="material-symbols-outlined text-[18px]" data-icon="logout">logout</span>
<span class="font-label-md text-label-md">Logout</span>
</a>
</div>
</div>
</aside>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col min-w-0">
<!-- TopAppBar -->
<header class="bg-surface h-16 w-full sticky top-0 z-40 bg-surface border-b border-outline-variant flex items-center justify-between px-6 w-full">
<div class="flex items-center gap-4">
<!-- Mobile Menu Button (Visible only on mobile) -->
<button class="md:hidden text-on-surface-variant hover:bg-surface-container rounded-full p-2 transition-all cursor-pointer active:opacity-80">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<div class="font-headline-md text-headline-md font-bold text-on-surface hidden md:block">Elections</div>
</div>
<div class="flex items-center gap-2">
<button class="text-on-surface-variant hover:text-on-surface hover:bg-surface-container rounded-full p-2 transition-all cursor-pointer active:opacity-80">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<button class="text-on-surface-variant hover:text-on-surface hover:bg-surface-container rounded-full p-2 transition-all cursor-pointer active:opacity-80">
<span class="material-symbols-outlined" data-icon="help">help</span>
</button>
<div class="ml-4 pl-4 border-l border-outline-variant">
<img alt="Administrator Profile" class="w-8 h-8 rounded-full object-cover border border-outline-variant" data-alt="A small, circular avatar image of a professional administrator in a modern, light-mode corporate dashboard environment. Crisp lighting, neutral background, conveying trust and precision." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAFm6RhK8uA1znQf6CqeZKnQY_rPbjCSuKOnvWAc0IQVyjhcdnBMFXXGoaEiWbIj4A3V1XmwoWRTHPfgIHdw3i5KZlKyqKOKyknzrZ2UitA3SB-edIFGkAh3rJRq5lUZnJfoJ6GT5kesXJiz4SMbJymrgcPrHqczOs1599A32SmqSUhAf9pLc3Tdh5LR_OkdB5muFDBftHsAlA1K3P7PHfsNspev4bwWfC6XqJyKY8P1tuoOJAKF0gvyw">
</div>
</div>
</header>
<!-- Page Content -->
<div class="flex-1 p-6 md:p-container-padding overflow-y-auto">
<div class="max-w-4xl mx-auto w-full">
<!-- Page Header -->
<div class="mb-section-gap flex items-center justify-between">
<div>
<h2 class="font-headline-lg text-headline-lg md:text-headline-lg text-on-surface">Edit Election</h2>
<p class="font-body-base text-body-base text-on-surface-variant mt-1">Update the details and schedule for this election event.</p>
</div>
</div>
<!-- Form Container -->
<div class="bg-card-light rounded-xl shadow-sm border border-outline-variant p-6">
<form class="space-y-6">
<!-- Basic Info Section -->
<div class="space-y-4">
<h3 class="font-headline-md text-headline-md text-on-surface border-b border-outline-variant pb-2">Basic Information</h3>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="electionName">Election Name</label>
<input class="w-full rounded-lg border-outline-variant bg-surface-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary shadow-sm font-body-base text-body-base p-2.5 transition-shadow" id="electionName" name="electionName" type="text" value="Annual Board of Directors Election 2024">
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="electionDescription">Description</label>
<textarea class="w-full rounded-lg border-outline-variant bg-surface-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary shadow-sm font-body-base text-body-base p-2.5 transition-shadow resize-y" id="electionDescription" name="electionDescription" rows="4">Please review the candidate profiles carefully before casting your vote. This election determines the strategic direction of the organization for the next fiscal year.</textarea>
</div>
</div>
<!-- Schedule Section -->
<div class="space-y-4 pt-4">
<h3 class="font-headline-md text-headline-md text-on-surface border-b border-outline-variant pb-2">Schedule</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Start Date/Time -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="startDate">Start Date &amp; Time</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]" data-icon="calendar_month">calendar_month</span>
</div>
<input class="w-full pl-10 rounded-lg border-outline-variant bg-surface-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary shadow-sm font-body-base text-body-base p-2.5 transition-shadow" id="startDate" name="startDate" type="datetime-local" value="2024-11-01T09:00">
</div>
</div>
<!-- End Date/Time -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="endDate">End Date &amp; Time</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]" data-icon="event_busy">event_busy</span>
</div>
<input class="w-full pl-10 rounded-lg border-outline-variant bg-surface-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary shadow-sm font-body-base text-body-base p-2.5 transition-shadow" id="endDate" name="endDate" type="datetime-local" value="2024-11-05T17:00">
</div>
</div>
</div>
</div>
<!-- Form Actions -->
<div class="flex items-center justify-end gap-3 pt-6 border-t border-outline-variant mt-8">
<button class="px-6 py-2.5 rounded-lg border border-outline-variant bg-surface text-on-surface font-label-md text-label-md hover:bg-surface-container transition-colors focus:ring-2 focus:ring-offset-2 focus:ring-outline-variant" type="button">
                                Cancel
                            </button>
<button class="px-6 py-2.5 rounded-lg bg-primary text-on-primary font-label-md text-label-md hover:opacity-90 shadow-sm transition-opacity focus:ring-2 focus:ring-offset-2 focus:ring-primary active:scale-95" type="submit">
                                Save Changes
                            </button>
</div>
</form>
</div>
</div>
</div>
</main>


</body></html>
