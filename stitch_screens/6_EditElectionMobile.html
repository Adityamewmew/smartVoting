<body class="bg-background text-on-background font-body-base antialiased md:hidden h-screen flex flex-col">
<!-- Top App Bar (Simplified for modal/form) -->
<header class="h-16 w-full sticky top-0 z-40 bg-surface border-b border-outline-variant flex items-center px-4 justify-between">
<button class="text-on-surface-variant hover:text-on-surface hover:bg-surface-container rounded-full p-2 transition-all cursor-pointer active:opacity-80">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface">Create Election</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto p-4 flex flex-col gap-element-gap pb-24">
<form class="flex flex-col gap-6">
<!-- Basic Info Section -->
<section class="bg-card-light rounded-xl p-4 shadow-sm border border-outline-variant/30 flex flex-col gap-4">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="election-name">Election Name</label>
<input class="w-full border border-outline-variant rounded-lg px-3 py-2 text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" id="election-name" placeholder="e.g., Annual Board Election 2024" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="election-desc">Description</label>
<textarea class="w-full border border-outline-variant rounded-lg px-3 py-2 text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" id="election-desc" placeholder="Provide details about the election..." rows="3"></textarea>
</div>
</section>
<!-- Schedule Section -->
<section class="bg-card-light rounded-xl p-4 shadow-sm border border-outline-variant/30 flex flex-col gap-4">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Schedule</h2>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="start-date">Start Date &amp; Time</label>
<div class="relative">
<input class="w-full border border-outline-variant rounded-lg px-3 py-2 text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent pr-10" id="start-date" type="datetime-local"/>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="end-date">End Date &amp; Time</label>
<div class="relative">
<input class="w-full border border-outline-variant rounded-lg px-3 py-2 text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent pr-10" id="end-date" type="datetime-local"/>
</div>
</div>
</section>
<!-- Settings Section -->
<section class="bg-card-light rounded-xl p-4 shadow-sm border border-outline-variant/30 flex flex-col gap-4">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Settings</h2>
<label class="flex items-center gap-3 cursor-pointer">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface">Allow write-in candidates</span>
</label>
<label class="flex items-center gap-3 cursor-pointer">
<input checked="" class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface">Require voter authentication</span>
</label>
</section>
</form>
</main>
<!-- Fixed Bottom Actions -->
<div class="fixed bottom-0 w-full bg-surface border-t border-outline-variant p-4 flex gap-3 z-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<button class="flex-1 py-3 px-4 rounded-lg font-label-md text-label-md font-medium text-on-surface bg-surface-container border border-outline-variant active:bg-surface-variant transition-colors" type="button">
            Cancel
        </button>
